name: CI

# Runs alongside docs-guard.yml, which checks only that documentation moved with
# the code. This one checks the code.
#
# Gating on pull requests, reporting on main. The repo commits straight to main,
# so a push-triggered failure is after the fact by construction — a red X is
# still the signal you want, and adding required status checks would break the
# workflow the repo actually uses.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 20 to match frontend/Dockerfile (node:20-alpine) rather than
      # whatever a developer happens to run locally — CI should verify the
      # version that actually ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      # Route handlers must go through safeFetchBackend(), which tolerates a
      # backend 500 arriving as plain text. A raw `res.json()` throws on that
      # and replaces the real status with an opaque parse error — the bug this
      # convention exists to prevent, and one the whole codebase was swept for.
      #
      # The exceptions stream non-JSON bodies (CSV, images) and so cannot use a
      # JSON helper; each already guards its own error path.
      - name: Guard against unguarded res.json() in route handlers
        run: |
          ALLOWED='app/api/exhibitors/\[id\]/documents/\[docId\]/download/route.ts|app/api/horses/\[id\]/documents/\[docId\]/download/route.ts|app/api/horses/\[id\]/documents/\[docId\]/view/route.ts|app/api/shows/\[showId\]/apha-export/route.ts|app/api/trainers/me/photo/route.ts'
          OFFENDERS=$(grep -rl 'const res = await fetch' app/api --include=route.ts | grep -Ev "$ALLOWED" || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::These route handlers call fetch() directly instead of safeFetchBackend():"
            echo "$OFFENDERS"
            echo "See docs/frontend.md — a backend 500 is not JSON, so res.json() throws and hides the real error."
            exit 1
          fi
          echo "All route handlers go through safeFetchBackend()."

      # `next build` is the only check that catches App Router breakage
      # `tsc --noEmit` cannot see: an invalid route segment export, a client
      # component importing a server-only module, a generateStaticParams
      # mismatch. The bind-mount hazard that keeps this out of RUN_TESTS.sh is
      # a local-only artifact — a runner has its own checkout and nothing to
      # clobber. The env values are build-time placeholders; these pages are
      # dynamic and must not reach a real backend during the build.
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-not-a-real-secret
          INTERNAL_API_KEY: ci-placeholder
          API_URL: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    # The suite is pure-logic and never opens a connection, but setting these
    # makes that independence explicit: a future test that reaches for a
    # database fails loudly here instead of silently hitting a default.
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      INTERNAL_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      # 3.12 to match backend/Dockerfile (python:3.12-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Compile check
        run: python -m compileall -q backend

      - name: Tests
        run: python -m pytest
        working-directory: backend
