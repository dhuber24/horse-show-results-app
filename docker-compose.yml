services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Optional. Unset just means a show is set up by hand rather than read off
      # its show bill.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional. Unset means nothing offers to take a payment online; every
      # payment screen says so. Use test keys here. See docs/design/payments.md.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_CARD_PERCENT_BP: ${STRIPE_CARD_PERCENT_BP:-290}
      STRIPE_CARD_FIXED_CENTS: ${STRIPE_CARD_FIXED_CENTS:-30}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    # `next dev` plus NEXT_DEV_FLAGS from .env: a checkout inside WSL's own
    # filesystem sets it to --turbopack. $$ leaves the variable for the
    # container's shell, so an unset value is simply nothing.
    command: ["sh", "-c", "exec npm run dev -- $$NEXT_DEV_FLAGS"]
    environment:
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_DEV_FLAGS=${NEXT_DEV_FLAGS:-}
      # A checkout on a Windows drive (C:\...) bind-mounts without fs events,
      # so the webpack watcher misses edits unless it polls -- the default.
      # A checkout inside WSL's filesystem gets real events: set it false
      # there. Turbopack has no polling mode at all, which is why it is only
      # turned on where events work. See README, "Faster on Windows".
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
      - CHOKIDAR_USEPOLLING=${WATCHPACK_POLLING:-true}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

