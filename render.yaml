# Render Blueprint for GaitDesk.
#
# Create a Blueprint from this file in the Render dashboard. Render prompts for
# every `sync: false` value; never add production credentials to this file.
#
# Before the first deploy, set the three URL values to the temporary Render
# service URLs. After custom domains are verified, replace them with:
#   API_URL: https://api.yourdomain.com
#   CORS_ORIGINS: https://yourdomain.com,https://www.yourdomain.com
#   AUTH_URL / PUBLIC_APP_URL: https://yourdomain.com
#
# Both services deploy only after the branch's CI checks pass
# (.github/workflows/ci.yml and docs-guard.yml, which both run on push to
# main). `git push` is still the deploy -- there is no release button -- but it
# is now a deploy that type-check, lint, tests, the frontend build and the docs
# guard have all agreed to. With `commit` this raced them: Render started
# building the instant the push landed and CI reported afterwards, so a change
# that failed tests but compiled went live and the red X arrived too late to
# mean anything.
#
# Consequence worth knowing: a check that never reports blocks the deploy
# rather than releasing without it, which is the safe direction but does mean a
# hotfix waits for CI. Render's dashboard can still deploy a commit manually.
services:
  - type: web
    name: gaitdesk-api
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./backend/Dockerfile.production
    dockerContext: ./backend
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_KEY
        generateValue: true
      # A guard rather than a load-bearing setting: no browser calls this API
      # directly (the web service makes every request server-side), so CORS is
      # not exercised in normal operation. Keep it correct anyway — it is what
      # stops another origin's page scripting the API if that ever changes.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: gaitdesk-web
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./frontend/Dockerfile.production
    dockerContext: ./frontend
    autoDeployTrigger: checksPass
    envVars:
      # Every backend request is made server-side, so this one runtime value is
      # the whole of it. There is deliberately no NEXT_PUBLIC_API_URL: no
      # browser code calls the API, so bundling a public copy of this URL would
      # be config that looks required and does nothing.
      - key: API_URL
        sync: false
      - key: INTERNAL_API_KEY
        fromService:
          name: gaitdesk-api
          type: web
          envVarKey: INTERNAL_API_KEY
      # Auth.js reads AUTH_SECRET; it is intentionally separate from the API key.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
