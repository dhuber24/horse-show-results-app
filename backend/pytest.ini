[pytest]
# Lives in `backend/` rather than the repo root on purpose. The host has no
# backend dependencies installed (Python 3.9, no SQLAlchemy), so the suite runs
# inside the backend image with `./backend` mounted at /app — see RUN_TESTS.sh.
# Keeping the config here means rootdir is the backend package either way, which
# is what makes the flat imports below resolve.
testpaths = tests

# Backend modules import flat: `import billing`, `from models import ...`. That
# only works if the backend directory itself is on sys.path.
pythonpath = .

addopts = -q --strict-markers
